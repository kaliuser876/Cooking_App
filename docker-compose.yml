version: "3.9"

services:
  db:
    image: mongo:6
    container_name: cooking_app_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
    container_name: cooking_app_server
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://db:27017/cooking_app
    depends_on:
      - db

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    container_name: cooking_app_client
    depends_on:
      - server
    environment:
      VITE_API_URL: /api

  nginx:
    image: nginx:alpine
    container_name: cooking_app_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # If using SSL certs:
      # - ./certs:/etc/ssl/certs:ro
      # - ./private:/etc/ssl/private:ro
    depends_on:
      - client
      - server

volumes:
  mongo_data: