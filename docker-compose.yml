version: "3.9"

services:
  db:
    image: mongo:6
    container_name: cooking_app_db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
    container_name: cooking_app_server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://db:27017/cooking_app
      VIRTUAL_HOST: api.snackthat.store
      VIRTUAL_PORT: 5000
      LETSENCRYPT_HOST: api.snackthat.store
      LETSENCRYPT_EMAIL: jonathan.richardson.work@gmail.com
    depends_on:
      - db

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: https://api.snackthat.store
    container_name: cooking_app_client
    restart: unless-stopped
    environment:
      VITE_API_URL: https://api.snackthat.store
      VIRTUAL_HOST: www.snackthat.store
      VIRTUAL_PORT: 80
      LETSENCRYPT_HOST: www.snackthat.store
      LETSENCRYPT_EMAIL: jonathan.richardson.work@gmail.com
    depends_on:
      - server

  nginx-proxy:
    image: jwilder/nginx-proxy:latest
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./certs:/etc/nginx/certs:ro
      - ./vhost.d:/etc/nginx/vhost.d
      - ./html:/usr/share/nginx/html

  letsencrypt:
    image: jrcs/letsencrypt-nginx-proxy-companion
    container_name: letsencrypt_companion
    restart: unless-stopped
    environment:
      NGINX_PROXY_CONTAINER: nginx_proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/etc/nginx/certs:rw
      - ./vhost.d:/etc/nginx/vhost.d
      - ./html:/usr/share/nginx/html
    depends_on:
      - nginx-proxy

volumes:
  mongo_data: