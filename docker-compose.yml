version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./server
    container_name: server
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    depends_on:
      - mongo
    # Required for Playwright to run browsers
    shm_size: '1gb'

  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    container_name: client
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  mongo_data: